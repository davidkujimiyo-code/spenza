<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complete Profile | SPENZA</title>

    <link rel="icon" type="image/png" href="../assets/logo/favicon.png">

    <link rel="stylesheet" href="../css/output.css">

    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300">

    <div class="min-h-screen grid lg:grid-cols-[1.3fr_1fr]">

        <!-- LEFT PANEL -->
        <div
            class="hidden lg:flex bg-slate-950 relative overflow-hidden items-center">

            <!-- Glow Orbs -->
            <div
                class="absolute top-20 left-10 w-72 h-72 bg-emerald-500/20 blur-3xl rounded-full">
            </div>

            <div
                class="absolute bottom-10 right-10 w-80 h-80 bg-cyan-500/20 blur-3xl rounded-full">
            </div>

            <!-- Grid Pattern -->
            <div
                class="absolute inset-0 opacity-10"
                style="
                background-image:
                linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px);
                background-size:40px 40px;">
            </div>

            <div
                class="relative z-10 w-full max-w-2xl mx-auto px-16 -mt-40">

                <img
                    src="../assets/logo/spenza-logo-dark.png"
                    alt="SPENZA"
                    class="h-20 mb-10">

                <h1
                    id="welcomeName"
                    class="text-6xl font-bold text-white leading-tight">

                    Welcome

                </h1>

                <p
                    class="mt-6 text-xl text-slate-300 leading-relaxed">

                    Let's personalize your SPENZA experience and build a financial plan tailored to you.

                </p>

                <!-- Progress Steps -->
                <div class="mt-10 flex flex-col gap-4 w-fit">

                    <div
                        id="stepPersonal"
                        class="group inline-flex items-center gap-3 bg-emerald-500/15 backdrop-blur-md rounded-xl px-5 py-3 border border-emerald-500/40
                        text-emerald-300 shadow-lg shadow-emerald-500/10 cursor-pointer">

                        <i data-lucide="user" class="group-hover:text-emerald-400 transition-colors"></i>

                        <span>Personal Information</span>

                    </div>

                    <div
                        id="stepFinancial"
                        class="group inline-flex items-center gap-3 bg-white/5 backdrop-blur-md rounded-xl px-5 py-3 border border-white/10 text-slate-200
                        hover:border-emerald-500/50 hover:bg-emerald-500/10 hover:-translate-y-1 hover:shadow-lg hover:shadow-emerald-500/20 transition-all duration-300 cursor-pointer">

                        <i data-lucide="wallet" class="group-hover:text-emerald-400 transition-colors"></i>

                        <span>Financial Setup</span>

                    </div>

                    <div
                        id="stepGoal"
                        class="group inline-flex items-center gap-3 bg-white/5 backdrop-blur-md rounded-xl px-5 py-3 border border-white/10 text-slate-200
                        hover:border-emerald-500/50 hover:bg-emerald-500/10 hover:-translate-y-1 hover:shadow-lg hover:shadow-emerald-500/20 transition-all duration-300 cursor-pointer">

                        <i data-lucide="target" class="group-hover:text-emerald-400 transition-colors"></i>

                        <span>Goal Preferences</span>

                    </div>

                </div>

            </div>

        </div>

        <!-- MOBILE HERO -->
        <div
            class="lg:hidden relative overflow-hidden bg-slate-950 text-white text-center px-6 py-12">

            <div
                class="absolute top-0 left-0 w-56 h-56 bg-emerald-500/20 blur-3xl rounded-full">
            </div>

            <div
                class="absolute bottom-0 right-0 w-56 h-56 bg-cyan-500/20 blur-3xl rounded-full">
            </div>

            <div
                class="absolute inset-0 opacity-10"
                style="
                background-image:
                linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px);
                background-size:40px 40px;">
            </div>

            <img
                src="../assets/logo/spenza-logo-dark.png"
                class="h-16 mx-auto mb-4 relative z-10">

            <h2
                id="mobileWelcomeName"
                class="text-3xl font-bold relative z-10">

                Welcome

            </h2>

            <p
                class="mt-3 text-white/80 relative z-10">

                Complete your profile to continue.

            </p>

        </div>

        <!-- FORM PANEL -->
        <div
            class="flex items-center justify-center px-6 py-6 lg:py-12">

            <div
                class="w-full max-w-xl bg-white dark:bg-slate-900 rounded-3xl p-8 shadow-xl border border-slate-200 dark:border-slate-800">

                <!-- Header -->
                <div>

                    <h2
                        class="text-3xl font-bold text-slate-900 dark:text-white">

                        Complete Profile

                    </h2>

                    <p
                        class="mt-2 text-slate-500 dark:text-slate-400">

                        Tell us a little more about yourself.

                    </p>

                </div>

                <!-- Progress -->
                <div class="mt-6">

                    <div
                        class="flex justify-between text-sm text-slate-500">

                        <span>Profile Completion</span>

                        <span id="profilePercent">20%</span>

                    </div>

                    <div
                        class="mt-2 h-2 bg-slate-200 rounded-full overflow-hidden">

                        <div
                            id="profileProgressBar"
                            class="h-full w-[20%] bg-emerald-500 transition-all duration-500">
                        </div>

                    </div>

                </div>

                <!-- FORM -->
                <form
                    id="profileForm"
                    class="mt-8 space-y-5">

                    <input
                        id="phone"
                        type="tel"
                        placeholder="Phone Number"
                        class="w-full px-4 py-4 rounded-2xl border border-slate-300 bg-white focus:border-emerald-500 focus:ring-4
                        focus:ring-emerald-500/10 outline-none transition-all duration-300">
                    <select
                        id="country"
                       class="w-full px-4 py-4 rounded-2xl border border-slate-300 bg-white focus:border-emerald-500 focus:ring-4
                        focus:ring-emerald-500/10 outline-none transition-all duration-300">

                        <option value="">Select Country</option>
                        <option>Nigeria</option>
                        <option>Ghana</option>
                        <option>Kenya</option>
                        <option>South Africa</option>

                    </select>

                    <select
                        id="currency"
                        class="w-full px-4 py-4 rounded-2xl border border-slate-300 bg-white focus:border-emerald-500 focus:ring-4
                        focus:ring-emerald-500/10 outline-none transition-all duration-300">

                        <option value="">Select Currency</option>
                        <option>NGN ₦</option>
                        <option>USD $</option>
                        <option>GBP £</option>
                        <option>EUR €</option>

                    </select>

                    <input
                        id="income"
                        type="number"
                        placeholder="Monthly Income"
                        class="w-full px-4 py-4 rounded-2xl border border-slate-300 bg-white focus:border-emerald-500 focus:ring-4
                        focus:ring-emerald-500/10 outline-none transition-all duration-300">

                    <select
                        id="incomeSource"
                        class="w-full px-4 py-4 rounded-2xl border border-slate-300 bg-white focus:border-emerald-500 focus:ring-4
                        focus:ring-emerald-500/10 outline-none transition-all duration-300">

                        <option value="">Income Source</option>
                        <option>Salary</option>
                        <option>Business</option>
                        <option>Freelance</option>
                        <option>Student</option>
                        <option>Other</option>

                    </select>

                    <!-- GOALS -->
                    <div>

                        <h3
                            class="font-semibold text-slate-900 dark:text-white mb-4">

                            Financial Goals

                        </h3>

                        <div
                            class="grid grid-cols-2 gap-3">

                            <button type="button" data-goal="Save More"
                            class="goal-card group relative p-5 rounded-2xl border-2 border-slate-200 bg-white
                            transition-all duration-300 text-left overflow-hidden">
                                
                                <div class="goal-check hidden absolute top-3 right-3">

                                    <i
                                        data-lucide="check-circle"
                                        class="w-5 h-5 text-white">
                                    </i>

                                </div>

                                <i data-lucide="wallet" class="goal-icon text-slate-600"></i>

                                <span>Save More</span>

                            </button>

                            <button type="button" data-goal="Emergency Fund"
                            class="goal-card group relative p-5 rounded-2xl border-2 border-slate-200 bg-white
                            transition-all duration-300 text-left overflow-hidden">
                                
                                <div class="goal-check hidden absolute top-3 right-3">

                                    <i
                                        data-lucide="check-circle"
                                        class="w-5 h-5 text-white">
                                    </i>

                                </div>
                            
                                <i data-lucide="target" class="goal-icon text-slate-600 "></i>

                                <span>Emergency Fund</span>

                            </button>

                            <button type="button" data-goal="Investing"
                            class="goal-card group relative p-5 rounded-2xl border-2 border-slate-200 bg-white
                            transition-all duration-300 text-left overflow-hidden">
                                
                                <div class="goal-check hidden absolute top-3 right-3">

                                    <i
                                        data-lucide="check-circle"
                                        class="w-5 h-5 text-white">
                                    </i>

                                </div>
                                
                                <i data-lucide="trending-up" class="goal-icon" text-slate-600></i>

                                <span>Investing</span>

                            </button>

                            <button type="button" data-goal="Reduce Spending"
                            class="goal-card group relative p-5 rounded-2xl border-2 border-slate-200 bg-white
                            transition-all duration-300 text-left overflow-hidden">
                                
                                <div class="goal-check hidden absolute top-3 right-3">

                                    <i
                                        data-lucide="check-circle"
                                        class="w-5 h-5 text-white">
                                    </i>

                                </div>

                                <i data-lucide="piggy-bank" class="goal-icon"text-slate-600></i>

                                <span>Reduce Spending</span>

                            </button>

                        </div>

                    </div>

                    <button
                        id="completeSetupBtn"
                        type="submit"
                        class="w-full py-4 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-semibold transition">

                        Complete Setup

                    </button>

                </form>

                <div
                    id="profileMessage"
                    class="hidden rounded-xl px-4 py-3 text-sm font-medium">
                </div>

            </div>

        </div>

    </div>

    <script src="../js/profile/profile.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

</body>

</html>
