<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SPENZA</title>

    <link rel="icon" type="image/png" href="../assets/logo/favicon.png">

    <link rel="stylesheet" href="../css/output.css">
</head>

<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-300">

    <div class="min-h-screen grid lg:grid-cols-[1.3fr_1fr]">

        <!-- LEFT SIDE -->
        <div
            class="hidden lg:flex bg-slate-950 relative overflow-hidden items-center">

            <!-- Glow Orbs -->
            <div
                class="absolute top-20 left-10 w-72 h-72 bg-emerald-500/20 blur-3xl rounded-full">
            </div>

            <div
                class="absolute bottom-10 right-10 w-80 h-80 bg-cyan-500/20 blur-3xl rounded-full">
            </div>

            <!-- Grid Pattern -->
            <div
                class="absolute inset-0 opacity-10"
                style="
                    background-image:
                    linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px);
                    background-size:40px 40px;">
            </div>

            <div
                class="relative z-10 w-full max-w-2xl mx-auto px-16">

                <img
                    src="../assets/logo/spenza-logo-dark.png"
                    alt="SPENZA"
                    class="h-20 mb-10">

                <h1
                    class="text-7xl font-bold text-white leading-tight">

                    <span class="block">
                        Welcome back
                    </span>

                    <span class="text-emerald-400 block">
                        To SPENZA
                    </span>

                </h1>

                <p
                    class="mt-6 text-xl text-slate-300 leading-relaxed">

                    Continue your financial journey and stay in control of your money.

                </p>

                <!-- Features -->
                <div class="mt-10 flex flex-col gap-4 w-fit">

                    <div class="group inline-flex items-center gap-3 text-slate-200 bg-white/5 backdrop-blur-md rounded-xl px-5 py-3 border border-white/10 hover:bg-emerald-500/10 
                        hover:border-emerald-400/40 hover:-translate-y-1 hover:shadow-lg hover:shadow-emerald-500/20 transition-all duration-300">
                        <i data-lucide="wallet" class="group-hover:text-emerald-400 transition-colors duration-300">
                        </i>

                        <span>Secure Login</span>
                    </div>

                    <div class="group inline-flex items-center gap-3 text-slate-200 bg-white/5 backdrop-blur-md rounded-xl px-5 py-3 border border-white/10 hover:bg-emerald-500/10 
                        hover:border-emerald-400/40 hover:-translate-y-1 hover:shadow-lg hover:shadow-emerald-500/20 transition-all duration-300">
                        <i data-lucide="target" class="group-hover:text-emerald-400 transition-colors duration-300">
                        </i>

                        <span>Budget Tracking</span>
                    </div>

                    <div class="group inline-flex items-center gap-3 text-slate-200 bg-white/5 backdrop-blur-md rounded-xl px-5 py-3 border border-white/10 hover:bg-emerald-500/10 
                        hover:border-emerald-400/40 hover:-translate-y-1 hover:shadow-lg hover:shadow-emerald-500/20 transition-all duration-300">
                        <i data-lucide="bar-chart-3"  class="group-hover:text-emerald-400 transition-colors duration-300"></i>

                        <span>Financial Insights</span>
                    </div>

                </div>

            </div>

        </div>

        <div
            class="lg:hidden relative overflow-hidden
            bg-slate-950 text-white text-center px-6 py-12">

            <div
                class="absolute top-0 left-0 w-56 h-56
                bg-emerald-500/20 blur-3xl rounded-full">
            </div>

            <div
                class="absolute bottom-0 right-0 w-56 h-56
                bg-cyan-500/20 blur-3xl rounded-full">
            </div>

            <div
                class="absolute inset-0 opacity-10"
                style="
                background-image:
                linear-gradient(rgba(255,255,255,.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.1) 1px, transparent 1px);
                background-size:40px 40px;">
            </div>

            <img
                src="../assets/logo/spenza-logo-dark.png"
                class="h-16 mx-auto mb-4 relative z-10">

            <h2 class="text-4xl font-bold relative z-10">
                Welcome Back
            </h2>

            <p class="mt-3 text-white/90 relative z-10">
                Login to continue your financial journey.
            </p>

        </div>

        <!-- FORM PANEL -->
        <div
            class="flex items-center justify-center
            px-6 py-6 lg:py-12">

            <div
                class="w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl p-8 shadow-xl border border-slate-200 dark:border-slate-800">

                <div class="hidden lg:block">

                    <img
                    src="../assets/logo/spenza-logo-light.png"
                    alt="SPENZA Logo"
                    class="h-14 w-auto mb-8">

                    <h2
                        class="text-3xl font-bold
                        text-slate-900 dark:text-white">

                        Login

                    </h2>

                    <p
                        class="mt-2 text-slate-500 dark:text-slate-400">

                        Welcome back to SPENZA.

                    </p>

                </div>

                <form id="loginForm" class="mt-8 space-y-5">

                    <input
                        id="email"
                        type="email"
                        placeholder="Email Address"
                        class="w-full px-4 py-4 rounded-2xl border border-slate-300 bg-white focus:border-emerald-500 focus:ring-4
                        focus:ring-emerald-500/10 outline-none transition-all duration-300">
                    <p id="emailError" class="text-red-500 text-xs mt-1 hidden"></p>

                    <div class="relative">

                        <input
                            id="password"
                            type="password"
                            placeholder="Password"
                            class="w-full px-4 py-4 rounded-2xl border border-slate-300 bg-white focus:border-emerald-500 focus:ring-4
                            focus:ring-emerald-500/10 outline-none transition-all duration-300">

                        <button
                            type="button"
                            id="togglePassword"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-emerald-500">

                            <i data-lucide="eye"></i>

                        </button>

                    </div>
                    
                    <div class="flex items-center justify-between">

                        <label
                            class="flex items-center gap-2 text-sm text-slate-500">

                            <input
                                type="checkbox"
                                id="rememberMe"
                                class="w-4 h-4 rounded border-slate-300 text-emerald-500 focus:ring-emerald-500">
                    
                            Remember Me

                        </label>

                        <a
                            href="#"
                            class="text-sm text-emerald-500 hover:text-emerald-600">

                            Forgot Password?

                        </a>

                    </div>
                    


                <div
                    id="formMessage"
                    class="hidden rounded-xl px-4 py-3 text-sm font-medium">

                </div>
                    <button
                        id="loginBtn"
                        type="submit"
                        class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white
                        font-semibold transition">

                        Login

                    </button>

                </form>

                <p
                    class="mt-6 text-center
                    text-slate-500">

                    Don't have an account?

                    <a
                        href="./register.html"
                        class="text-emerald-500 font-semibold">

                        Register

                    </a>

                </p>

            </div>

        </div>

    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../js/auth/login.js"></script>

</body>
</html>
